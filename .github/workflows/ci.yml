name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # SHA = actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # SHA = pnpm/setup@v2.1.0
      - name: Setup toolchain and install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck

      - name: Lint
        run: pnpm exec nx run-many -t lint

      - name: Build
        run: pnpm exec nx run-many -t build

      - name: Test
        run: pnpm exec nx run-many -t test
