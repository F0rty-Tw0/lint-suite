name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump, or publish-current to retry the current version'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - publish-current

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Lint Suite
    permissions:
      contents: write
      id-token: write

    steps:
      # SHA = actions/checkout@v7.0.0
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # SHA = pnpm/action-setup@v6.0.9
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.13.1

      # SHA = actions/setup-node@v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.21.0
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        if: inputs.version != 'publish-current'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm run release:ci -- "$RELEASE_VERSION"

      - name: Publish current version
        if: inputs.version == 'publish-current'
        run: |
          pnpm exec nx run lint-suite:build
          cd dist/packages/lint-suite/src
          VERSION=$(node --print "require('./package.json').version")
          npm view "lint-suite@$VERSION" version 2>/dev/null \
            && echo "lint-suite@$VERSION already published" \
            || pnpm publish --provenance --access public --no-git-checks
