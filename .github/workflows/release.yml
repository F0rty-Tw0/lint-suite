name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump, or publish-current to retry the current version'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - publish-current

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Lint Suite
    permissions:
      contents: write
      id-token: write

    steps:
      # SHA = actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # SHA = pnpm/setup@v2.1.0
      - name: Setup toolchain and install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24.20.0
          cache: true
          require-lockfile: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        if: inputs.version != 'publish-current'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm run release:ci -- "$RELEASE_VERSION"

      - name: Publish current version
        if: inputs.version == 'publish-current'
        run: |
          pnpm exec nx run lint-suite:build
          cd dist/packages/lint-suite/src
          VERSION=$(node --print "require('./package.json').version")
          npm view "lint-suite@$VERSION" version 2>/dev/null \
            && echo "lint-suite@$VERSION already published" \
            || pnpm publish --no-git-checks --provenance --access public
