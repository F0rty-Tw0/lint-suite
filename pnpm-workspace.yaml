packages:
  - 'packages/*'

catalogs:
  angular:
    '@angular/compiler': '22.1.5'
    angular-eslint: '^22.2.0'
    globals: '17.12.0'
  base:
    '@nx/eslint-plugin': '23.2.0'
    '@stylistic/eslint-plugin': '5.10.0'
    eslint: '^10.9.1'
    eslint-plugin-import-x: '4.17.1'
  boundaries:
    eslint-plugin-boundaries: '7.2.0'

  javascript:
    '@eslint/js': '^10.0.1'
  json:
    '@eslint/json': '^2.1.0'
  playwright:
    eslint-plugin-playwright: '2.11.0'
  prettier:
    eslint-config-prettier: '^10.1.8'
    prettier: '^3.9.6'
  rxjs:
    '@smarttools/eslint-plugin-rxjs': '1.0.22'
  storybook:
    eslint-plugin-storybook: '10.6.0'
  stylelint:
    stylelint: '17.14.1'
    stylelint-config-recess-order: '7.8.0'
    stylelint-config-standard: '40.0.0'
    stylelint-config-standard-scss: '17.0.0'
    stylelint-scss: '7.2.0'
    stylelint-selector-bem-pattern: '5.0.0'
  typescript:
    '@typescript-eslint/utils': '8.69.0'
    eslint-import-resolver-typescript: '4.4.5'
    typescript: '^6.0.3'
    typescript-eslint: '8.69.0'
  typescript-compatibility:
    typescript: '>=6.0.3'
  vitest:
    '@vitest/eslint-plugin': '1.6.27'
  dev:
    '@angular/common': '22.1.5'
    '@angular/core': '22.1.5'
    '@angular/forms': '22.1.5'
    '@angular/platform-browser': '22.1.5'
    '@eslint/js': '^10.0.1'
    '@nx/esbuild': '23.2.0'
    '@nx/eslint': '23.2.0'
    '@nx/eslint-plugin': '23.2.0'
    '@nx/js': '23.2.0'
    '@nx/vitest': '23.2.0'
    '@release-it/keep-a-changelog': '^8.0.0'
    '@types/node': '^26.4.1'
    angular-eslint: '^22.2.0'
    esbuild: '^0.28.2'
    eslint: '^10.9.1'
    eslint-config-prettier: '10.1.8'
    jsonc-eslint-parser: '^3.3.0'
    nx: '23.2.0'
    prettier: '^3.9.6'
    release-it: '^21.0.2'
    tslib: '^2.8.1'
    typescript: '6.0.3'
    typescript-eslint: '8.69.0'
    vitest: '^5.0.0'

catalogMode: strict
catalogPrune: true

# pnpm 11: replaces the removed `onlyBuiltDependencies` setting.
allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true
  unrs-resolver: true
